version: 2
compose:
  file: compose.upgrade.yml
paths:
  - name: v1-via-v2-to-target
    from:
      env: {APP_TAG: v1}
    via:
      - env: {APP_TAG: v2}
    to:
      env: {APP_TAG: current}
      build:
        services: [app]
        tag_env: APP_TAG
health:
  type: http
  url: http://127.0.0.1:18081/health
  timeout: 60s
  interval: 1s
seed: {command: ./upgrade-tests/seed.sh, timeout: 30s}
verify:
  checks:
    - name: file-state-preserved
      command: ./upgrade-tests/check-state.sh
      timeout: 30s
