version: 2
compose:
  file: compose.upgrade.yml
paths:
  - name: v1-to-target-with-postgres
    from:
      env: {APP_TAG: v1}
    to:
      env: {APP_TAG: current}
      build:
        services: [app]
        tag_env: APP_TAG
health:
  type: http
  url: http://127.0.0.1:18083/health
  timeout: 90s
  interval: 1s
seed: {command: ./upgrade-tests/seed.sh, timeout: 30s}
verify:
  checks:
    - name: postgres-user-preserved
      command: ./upgrade-tests/check-user.sh
      timeout: 30s
