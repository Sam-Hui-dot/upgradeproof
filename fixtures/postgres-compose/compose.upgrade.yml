services:
  app:
    image: ${UPGRADEPROOF_IMAGE}
    build:
      context: ./app
      args:
        APP_VERSION: target
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: upgradeproof
    ports:
      - "18083:8080"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upgradeproof
      POSTGRES_USER: upgradeproof
      POSTGRES_PASSWORD: upgradeproof
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgradeproof -d upgradeproof"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
