version: 2
compose:
  file: compose.upgrade.yml
paths:
  - name: detects-broken-target
    from:
      env: {APP_TAG: v1}
    to:
      env: {APP_TAG: current}
      build:
        services: [app]
        tag_env: APP_TAG
health:
  type: http
  url: http://127.0.0.1:18082/health
  timeout: 60s
  interval: 1s
seed: {command: ./upgrade-tests/seed.sh, timeout: 30s}
verify:
  checks:
    - name: state-value-preserved
      command: ./upgrade-tests/check-state.sh
      timeout: 30s
