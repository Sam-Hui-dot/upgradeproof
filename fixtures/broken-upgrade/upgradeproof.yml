version: 1
compose:
  file: compose.upgrade.yml
  service: app
  image_env: UPGRADEPROOF_IMAGE
paths:
  - name: broken-target-is-detected
    from: upgradeproof-fixture-broken:v1
    to:
      build:
        service: app
health:
  type: http
  url: http://127.0.0.1:18082/health
  timeout: 60s
  interval: 1s
seed:
  command: ./upgrade-tests/seed.sh
  timeout: 30s
verify:
  checks:
    - name: state-value-preserved
      command: ./upgrade-tests/check-state.sh
      timeout: 30s
